<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра — предскажи, что напечатает</title>
<style>
  :root{--bg:#12151a;--card:#1a1f27;--card2:#212833;--line:#2c3541;--fg:#e6e9ee;--dim:#9aa5b4;
        --acc:#5aa9ff;--ok:#3ecf8e;--warn:#e5b567}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 "Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:14px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 16px}
  pre{background:#0d1218;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:Consolas,monospace;
      font-size:15px;white-space:pre-wrap;margin:0 0 14px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:9px;
       padding:10px 14px;font:inherit;cursor:pointer}
  .opt:hover{border-color:var(--acc)}
  .opt.right{border-color:var(--ok);background:#16301f}
  .opt.wrong{border-color:#ff8a8a;background:#2e1a1a}
  .opt:disabled{cursor:default}
  .fb{margin-top:12px;font-size:15px;color:#cfd6e0}
  .fb b{color:var(--acc)}
  .score{color:var(--dim);font-size:14px}
  .score b{color:var(--fg)}
  .btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
       padding:8px 14px;font:inherit;cursor:pointer}
  .btn.primary{background:var(--acc);color:#08111c;border-color:var(--acc);font-weight:700}
  .done{color:var(--ok);font-size:19px;font-weight:700;margin:0 0 10px}
  .note{color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Игра — предскажи, что напечатает</h1>
  <div class="sub">Шесть раундов. Балл за игру в блок не идёт: это проверка на месте, чтобы увидеть
  свои догадки. Переиграть можно сколько угодно.</div>
  <div class="card">
    <div class="score">Раунд <b id="rn">1</b> из <b>6</b> · верно <b id="okc">0</b> из <b id="tot">0</b></div>
    <div id="body"></div>
  </div>
</div>

<script>
const SESSION = Number("__SESSION__") || 0;

const ROUNDS = [
  { code: "x = 3\nx = x + 1\nprint(x)",
    opts: ["3", "4", "31"], right: 1,
    why: "Переменная держит одно значение: после второй строки в ней 4, старое вытеснено." },
  { code: 'print("5" + "2")',
    opts: ["7", "52", "ошибка"], right: 1,
    why: "Кавычки делают строку: строки склеиваются, а не складываются как числа." },
  { code: "for i in range(3):\n    print(i)",
    opts: ["1 2 3", "0 1 2", "0 1 2 3"], right: 1,
    why: "range(3) — это 0, 1, 2. Счёт с нуля и без последнего числа — самая частая неожиданность." },
  { code: "total = 0\nfor i in [1, 2, 3]:\n    total = total + i\nprint(total)",
    opts: ["3", "6", "123"], right: 1,
    why: "Цикл добавляет каждый элемент к сумме: 0+1+2+3 = 6." },
  { code: 'items = ["a", "b"]\nitems.append("c")\nprint(len(items))',
    opts: ["2", "3", "ошибка: append нет у списка"], right: 1,
    why: "append добавляет в конец, длина становится 3." },
  { code: "x = 5\nif x > 10:\n    print('много')\nprint('конец')",
    opts: ["много\\nконец", "конец", "ничего"], right: 1,
    why: "Ветка не сработала, но строка после условия выполняется всегда: печатается только «конец»." },
];

let cur = 0, ok = 0, answered = 0;
const body = document.getElementById("body");

function progress(finish) {
  fetch("/progress", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session: SESSION, page: "game", screen: cur + 1, total: ROUNDS.length,
                          score: ok, answered, finished: !!finish})
  }).catch(() => {});
}

function draw() {
  document.getElementById("rn").textContent = cur + 1;
  document.getElementById("okc").textContent = ok;
  document.getElementById("tot").textContent = answered;
  if (cur >= ROUNDS.length) return finish();
  const r = ROUNDS[cur];
  body.innerHTML = `<pre></pre><div class="opts"></div><div class="fb"></div>`;
  body.querySelector("pre").textContent = r.code;
  const opts = body.querySelector(".opts");
  const fb = body.querySelector(".fb");
  r.opts.forEach((label, idx) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = label.replace(/\\n/g, " / ");
    b.onclick = () => {
      answered++;
      const right = idx === r.right;
      if (right) ok++;
      opts.querySelectorAll(".opt").forEach((el, i) => {
        el.disabled = true;
        if (i === r.right) el.classList.add("right");
        else if (i === idx) el.classList.add("wrong");
      });
      fb.innerHTML = `<b>${right ? "верно" : "нет"}</b>. ${r.why}`;
      const next = document.createElement("button");
      next.className = "btn primary";
      next.style.marginTop = "12px";
      next.textContent = cur === ROUNDS.length - 1 ? "итог" : "дальше →";
      next.onclick = () => { cur++; draw(); };
      fb.appendChild(next);
      document.getElementById("okc").textContent = ok;
      document.getElementById("tot").textContent = answered;
      progress(false);
    };
    opts.appendChild(b);
  });
}

function finish() {
  body.innerHTML = `<p class="done">Верно ${ok} из ${ROUNDS.length}.</p>
    <p class="note">Игра ничего не оценивает и не меняет очередь повторов: она показывает, где
    догадка расходится с тем, что делает код. Дальше — блок вопросов, там уже балл.</p>
    <p class="note">Разбор каждого раунда — на экране после ответа; если хочется ещё,
    перезагрузи страницу.</p>`;
  const back = document.createElement("button");
  back.className = "btn primary";
  back.textContent = "к вопросам блока →";
  back.onclick = () => { location.href = "/"; };
  body.appendChild(back);
  progress(true);   // финиш фиксируется сразу: флаг входа снимется, даже если вкладку закроют
}

draw();
</script>
</body>
</html>
